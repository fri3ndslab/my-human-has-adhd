<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 214" width="880" height="214" role="img" aria-label="How a parked idea comes back: only on what now, a finished task, or its event; it starts only when you pick it">
<title>How a parked idea comes back: only on what now, a finished task, or its event; it starts only when you pick it</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="16" y="16" width="188" height="124" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="30" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">1  You drop an idea</text><text x="30" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">“oh and also…”</text><text x="30" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">in the middle of a task</text><path d="M208,78 L232,78" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="236" y="16" width="188" height="124" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="250" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1a7f37" text-anchor="start">2  It is parked</text><text x="250" y="76" font-family="ui-monospace,'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">#2 &quot;your words&quot;</text><text x="250" y="100" font-family="ui-monospace,'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">trigger: an event</text><text x="250" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">never a date</text><path d="M428,78 L452,78" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="456" y="16" width="188" height="124" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="470" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">3  It comes back when</text><text x="470" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">you ask “what now”</text><text x="470" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">the task is done</text><text x="470" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">its event happens</text><path d="M648,78 L672,78" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="676" y="16" width="188" height="124" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="690" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">4  You pick</text><text x="690" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">up to 3 lettered options</text><text x="690" y="100" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">starts only on a letter</text><text x="690" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">silence is not a yes</text><rect x="16" y="158" width="848" height="40" rx="8" fill="#ffebe9" stroke="#d1d9e0" stroke-width="1"/><text x="440" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#d1242f" text-anchor="middle">Never: timers · random nudges · “by the way, you once said…”</text>
</svg>
