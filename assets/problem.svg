<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="One mid-task idea, three outcomes: the agent chases it, forgets it, or parks it in PARK.md">
<title>One mid-task idea, three outcomes: the agent chases it, forgets it, or parks it in PARK.md</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="16" y="106" width="250" height="118" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="32" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">mid-task, in one message:</text><text x="32" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">“oh and also, export to</text><text x="32" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">markdown would be really</text><text x="32" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">useful, people keep asking!”</text><rect x="330" y="16" width="534" height="92" rx="8" fill="#ffebe9" stroke="#d1d9e0" stroke-width="1"/><rect x="330" y="16" width="6" height="92" rx="3" fill="#d1242f"/><text x="352" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#d1242f" text-anchor="start">Chases it</text><text x="352" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">Builds the idea nobody picked. The task grows, the diff grows.</text><text x="352" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#d1242f" text-anchor="start">Codex, no rules: built the markdown export in 3 of 3 runs</text><path d="M266,165 C300,165 296,62 326,62" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="330" y="124" width="534" height="92" rx="8" fill="#fff8c5" stroke="#d1d9e0" stroke-width="1"/><rect x="330" y="124" width="6" height="92" rx="3" fill="#9a6700"/><text x="352" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#9a6700" text-anchor="start">Forgets it</text><text x="352" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">Nothing is written down. The next session starts from git diff.</text><text x="352" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9a6700" text-anchor="start">Claude Code, no rules: 6 of 9 mid-task ideas gone the next day</text><path d="M266,165 C300,165 296,170 326,170" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/><rect x="330" y="232" width="534" height="92" rx="8" fill="#dafbe1" stroke="#d1d9e0" stroke-width="1"/><rect x="330" y="232" width="6" height="92" rx="3" fill="#1a7f37"/><text x="352" y="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1a7f37" text-anchor="start">Parks it</text><text x="352" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">parked: #2 → PARK.md, in your words, with the event that brings it back.</text><text x="352" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a7f37" text-anchor="start">With CORE.md: 0 of 18 ideas lost, all 18 back the next day</text><path d="M266,165 C300,165 296,278 326,278" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
